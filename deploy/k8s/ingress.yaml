apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: disapyr
  namespace: disapyr
  annotations:
    # cert-manager: automatically provision a Let's Encrypt certificate.
    # Requires cert-manager + a ClusterIssuer named "letsencrypt-prod" to be installed.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "11m"   # slightly above MAX_SECRET_BYTES
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx   # ← change to "traefik" or "haproxy" if that's what your cluster uses
  tls:
    - hosts:
        - your-domain.example.com   # ← update
      secretName: disapyr-tls
  rules:
    - host: your-domain.example.com   # ← update
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: disapyr
                port:
                  number: 80
