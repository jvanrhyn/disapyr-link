apiVersion: v1
kind: ConfigMap
metadata:
  name: disapyr-config
  namespace: disapyr
data:
  PORT: "8080"
  BASE_URL: "https://your-domain.example.com"   # ← update before deploying
  MAX_SECRET_BYTES: "10485760"
  LOG_LEVEL: "info"
  LOG_DB_MIN_LEVEL: "warn"
  TRUST_PROXY: "true"                            # behind ingress controller
  RATE_LIMIT_CREATE_PER_MIN: "10"
  RATE_LIMIT_REVEAL_PER_MIN: "20"
  RATE_LIMIT_HEALTH_PER_MIN: "5"
